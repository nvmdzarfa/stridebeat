appId: com.stridebeat.app
---
# Flow Pengujian Otomatis Maestro untuk Milestone M0 — Navigasi & Skeleton
# Menjalankan verifikasi alur utama: Beranda -> Mulai Olahraga -> Workout -> Selesai -> Recap -> Riwayat -> Pengaturan

- launchApp:
    clearState: true

# 1. Verifikasi Layar Beranda
- assertVisible: "Halo, Pelari!"
- assertVisible: "MULAI OLAHRAGA"
- assertVisible: "CONTOH"

# 2. Mulai Olahraga -> Masuk ke Layar Workout
- tapOn: "MULAI OLAHRAGA"
- assertVisible: "LARI (OUTDOOR)"
- assertVisible: "WAKTU BERJALAN"
- assertVisible: "Area Peta Live Tracking"

# 3. Interaksi Pause & Selesai di Workout
- tapOn: "Jeda"
- assertVisible: "Dijeda"
- tapOn: "Lanjut"
- tapOn: "Selesai"

# 4. Dialog Konfirmasi Selesai
- assertVisible: "Selesaikan Sesi?"
- tapOn: "Ya, Selesai"

# 5. Verifikasi Layar Recap
- assertVisible: "Recap Olahraga"
- assertVisible: "Lagu yang Menemanimu"
- tapOn: "Selesai & Simpan"

# 6. Verifikasi Navigasi Bottom Bar: Riwayat & Pengaturan
- tapOn: "Riwayat"
- assertVisible: "Riwayat Olahraga"

- tapOn: "Pengaturan"
- assertVisible: "AKUN TERHUBUNG"
- assertVisible: "Strava"
- assertVisible: "Spotify"
- assertVisible: "YouTube Music"
- assertVisible: "Beta / Tidak Resmi"
