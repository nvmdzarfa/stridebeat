appId: com.stridebeat.app
---
# Flow Pengujian Otomatis Maestro untuk Milestone M3/M6 — Multi-Source Music Player & Switcher
# Memverifikasi US-02 & US-03: Ganti sumber musik tanpa mereset tracking, pencatatan lagu per sesi

- launchApp:
    clearState: true

# 1. Mulai Workout
- assertVisible: "MULAI OLAHRAGA"
- tapOn: "MULAI OLAHRAGA"

# 2. Buka Bottom Sheet Pemutar Musik
- assertVisible: "WAKTU BERJALAN"
- tapOn:
    id: "mini_player"
    optional: true

# 3. Verifikasi Sheet Pemutar Musik & Sumber Aktif
- assertVisible: "SUMBER MUSIK AKTIF"
- assertVisible: "SoundCloud"
- assertVisible: "YouTube Music"

# 4. Ganti Sumber Musik ke YouTube Music (US-02)
- tapOn: "YouTube Music"

# 5. Tutup Sheet & Verifikasi Tracking Tetap Berjalan Normal Tanpa Reset
- back
- assertVisible: "WAKTU BERJALAN"

# 6. Selesaikan Sesi & Verifikasi Rekap Lagu
- tapOn: "Selesai"
- tapOn: "Ya, Selesai"
- assertVisible: "Recap Olahraga"
