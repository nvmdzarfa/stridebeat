name: Build StrideBeat APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build StrideBeat APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          YOUTUBE_MUSIC_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_MUSIC_OAUTH_CLIENT_ID }}
          SOUNDCLOUD_CLIENT_ID: ${{ secrets.SOUNDCLOUD_CLIENT_ID }}
        run: |
          echo "SPOTIFY_CLIENT_ID=11f00fd3daf04d1a9c6b38594a26005a" >> local.properties
          echo "SPOTIFY_REDIRECT_URI=stridebeat://spotify-callback" >> local.properties
          CLEAN_STRAVA_ID=$(printf '%s' "$STRAVA_CLIENT_ID" | tr -d '[:space:]')
          CLEAN_STRAVA_SECRET=$(printf '%s' "$STRAVA_CLIENT_SECRET" | tr -d '[:space:]')
          if [ -n "$CLEAN_STRAVA_ID" ]; then
            echo "STRAVA_CLIENT_ID=$CLEAN_STRAVA_ID" >> local.properties
          fi
          if [ -n "$CLEAN_STRAVA_SECRET" ]; then
            echo "STRAVA_CLIENT_SECRET=$CLEAN_STRAVA_SECRET" >> local.properties
          fi
          if [ -n "$YOUTUBE_MUSIC_OAUTH_CLIENT_ID" ]; then
            echo "YOUTUBE_MUSIC_OAUTH_CLIENT_ID=$YOUTUBE_MUSIC_OAUTH_CLIENT_ID" >> local.properties
          fi
          if [ -n "$SOUNDCLOUD_CLIENT_ID" ]; then
            echo "SOUNDCLOUD_CLIENT_ID=$SOUNDCLOUD_CLIENT_ID" >> local.properties
          fi
          if [ -n "$CLEAN_STRAVA_ID" ] && [ -n "$CLEAN_STRAVA_SECRET" ]; then
            echo "✅ STRAVA_CLIENT_ID & STRAVA_CLIENT_SECRET configured"
          else
            echo "⚠️ Strava secrets incomplete or missing"
          fi

      - name: Decode Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            echo "HAS_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"
            echo "✅ google-services.json decoded from secret"
          elif [ -f app/google-services.json ]; then
            echo "HAS_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"
            echo "✅ app/google-services.json already present"
          else
            echo "HAS_GOOGLE_SERVICES=false" >> "$GITHUB_ENV"
            echo "⚠️ GOOGLE_SERVICES_JSON_BASE64 secret not set yet — Firebase Auth/Firestore inactive in this build"
          fi

      - name: Decode Release Keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            KEYSTORE_FILE="${{ runner.temp }}/stridebeat-release.jks"
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "SIGNING_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "IS_SIGNED_RELEASE=true" >> "$GITHUB_ENV"
            echo "✅ Release signing keystore configured"
          else
            echo "IS_SIGNED_RELEASE=false" >> "$GITHUB_ENV"
            echo "⚠️ Release signing secrets not set yet — falling back to Debug APK verification build"
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Extract App Version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Extracted App Version: $VERSION"

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --info --stacktrace || {
            echo "::error::Unit Tests Failed. Printing reports below:"
            for f in $(find app/build/reports/tests/testDebugUnitTest/ -name "*.html" 2>/dev/null); do
              echo "FILE: $f"
              cat "$f" | grep -A 5 -B 2 "failure" || true
            done
            exit 1
          }

      - name: Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/

      - name: Build APK with Gradle
        run: |
          mkdir -p release-output
          if [ "$IS_SIGNED_RELEASE" = "true" ]; then
            ./gradlew assembleRelease --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "release-output/StrideBeat-v${APP_VERSION}.apk"
          else
            ./gradlew assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "release-output/StrideBeat-v${APP_VERSION}-debug.apk"
          fi

      - name: Verify APK Alignment, Signing (v1/v2/v3), and Manifest
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          APK_FILE=$(ls release-output/*.apk | head -n 1)
          echo "Verifying $APK_FILE with build-tools $BT"
          "$BT/zipalign" -c -v 4 "$APK_FILE" | tail -n 15
          "$BT/apksigner" verify --verbose --print-certs "$APK_FILE"
          "$BT/aapt2" dump badging "$APK_FILE" | head -n 25

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrideBeat-v${{ env.APP_VERSION }}
          path: release-output/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main' && env.IS_SIGNED_RELEASE == 'true' && env.HAS_GOOGLE_SERVICES == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: StrideBeat v${{ env.APP_VERSION }} (Voice Audio Cues TTS, Audio Ducking & Split Tracking)
          body: |
            ### 🏃 StrideBeat v${{ env.APP_VERSION }} Release — Panduan Suara Lari (Voice Audio Cues TTS) & Audio Ducking

            Unduh file `.apk` di bawah — **bisa langsung di-update di atas build sebelumnya tanpa uninstall!**
            - 🗣️ **Panduan Suara Berbahasa Indonesia (Voice Audio Cues TTS)**: Laporan audio otomatis saat workout sedang berlangsung. Mendukung pengucapan KM split, durasi, split pace, rata-rata pace, dan status workout (Mulai, Jeda, Lanjut, Selesai, Auto-pause).
            - 🔉 **Fitur Audio Ducking Cerdas**: Saat suara pemandu berbicara, volume musik ExoPlayer otomatis diturunkan ke level lembut (25%) dan kembali ke 100% setelah ucapan selesai tanpa memutus pemutaran lagu SoundCloud/YouTube Music.
            - ⚙️ **Pengaturan Workout & Interval Kustom**: Opsi kustomisasi di Pengaturan: Aktif/Nonaktifkan Panduan Suara, serta pilihan interval jarak (500 m, 1.0 km, 2.0 km), Auto-Pause, dan satuan jarak.
          files: release-output/StrideBeat-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
