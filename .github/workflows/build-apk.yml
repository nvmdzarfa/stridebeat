name: Build StrideBeat APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          echo "SPOTIFY_CLIENT_ID=11f00fd3daf04d1a9c6b38594a26005a" >> local.properties
          echo "SPOTIFY_REDIRECT_URI=stridebeat://spotify-callback" >> local.properties

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/StrideBeat-v0.0.7.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrideBeat-v0.0.7
          path: release-output/StrideBeat-v0.0.7.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.7
          name: StrideBeat v0.0.7
          body: |
            ### 🏃 StrideBeat v0.0.7 Release
            
            Unduh file `.apk` di bawah dan install di HP Android kamu:
            - **Suara Audio Berbunyi 100%**: Mengupgrade engine pemutar ke **AndroidX Media3 ExoPlayer** (mendukung penuh HLS fMP4, progressive MP3, & AAC).
            - **Bebas Algoritma India**: Menghapus JioSaavn sepenuhnya; hasil pencarian sekarang global, akurat (Rex Orange County, The Weeknd, Kanye, Phonk, Hindia, Pop, dll.).
            - **Full Song Playback**: Memfilter ketat snippet pendek sehingga seluruh lagu yang diputar berdurasi penuh (3-5 menit).
          files: release-output/StrideBeat-v0.0.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
