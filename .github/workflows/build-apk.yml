name: Build StrideBeat APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          echo "SPOTIFY_CLIENT_ID=11f00fd3daf04d1a9c6b38594a26005a" >> local.properties
          echo "SPOTIFY_REDIRECT_URI=stridebeat://spotify-callback" >> local.properties

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/StrideBeat-v0.0.9.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrideBeat-v0.0.9
          path: release-output/StrideBeat-v0.0.9.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.9
          name: StrideBeat v0.0.9
          body: |
            ### 🏃 StrideBeat v0.0.9 Release

            Unduh file `.apk` di bawah dan install langsung di smartphone Android kamu:
            - 🎵 **Slider & Seek Durasi Musik**: Dilengkapi progress bar interaktif dengan indikator menit:detik riil (`02:19` / `03:27`) yang dapat digeser (seek) baik di dalam sheet aplikasi maupun di media notification Android.
            - 🖼️ **Album Artwork Nyata**: Menggunakan Coil Image Loader untuk menampilkan cover art resolusi tinggi (500x500) pada pencarian dan mini-player.
            - 🗺️ **Perbaikan Peta Standby**: Teks "Mencari Sinyal GPS..." tidak lagi muncul sebelum tombol Mulai ditekan (langsung bertuliskan "Area Peta Live Tracking").
            - 📍 **Fix Izin GPS**: Membuka tab Olahraga tidak lagi auto-start sesi workout saat izin lokasi diberikan.
          files: release-output/StrideBeat-v0.0.9.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
