name: Build StrideBeat APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: |
          echo "SPOTIFY_CLIENT_ID=11f00fd3daf04d1a9c6b38594a26005a" >> local.properties
          echo "SPOTIFY_REDIRECT_URI=stridebeat://spotify-callback" >> local.properties

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/StrideBeat-v0.0.8.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StrideBeat-v0.0.8
          path: release-output/StrideBeat-v0.0.8.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.8
          name: StrideBeat v0.0.8
          body: |
            ### 🏃 StrideBeat v0.0.8 Release

            Unduh file `.apk` di bawah dan install di HP Android kamu:
            - **Hapus Data Dummy**: Membersihkan data contoh dan seed dari database lokal SQLite (Room).
            - **Real Beranda & Riwayat**: Ringkasan mingguan dan kartu Sesi Terakhir kini menghitung data riil secara otomatis tanpa badge `[CONTOH]`.
            - **Tampilan Bersih**: Menghapus label teknis seperti `(M1)` pada menu Pengaturan dan merapikan teks dialog.
          files: release-output/StrideBeat-v0.0.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
